    <style>
        /* ── Filter Sidebar ─────────────────────────────────────── */
        .ss-filter-card {
            background: #fff;
            border: 1px solid #eef0f2;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .04);
            position: sticky;
            top: 90px;
        }

        .ss-filter-title {
            font-size: 15px;
            font-weight: 700;
            color: #1e4356;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ss-filter-card .form-select,
        .ss-filter-card .form-control {
            border-radius: 8px;
            border-color: #dfe3e6;
            font-size: 14px;
        }

        .ss-filter-card .form-select:focus,
        .ss-filter-card .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 .2rem rgba(25, 135, 84, .15);
        }

        .ss-filter-card .btn-clear {
            width: 100%;
            border-radius: 8px;
            font-weight: 500;
            border-color: #dee2e6;
            color: #495057;
        }

        .ss-filter-card .btn-clear:hover {
            background-color: #198754;
            border-color: #198754;
            color: #fff;
        }

        /* ── Section heading ────────────────────────────────────── */
        .ss-section-title {
            color: #1e4356;
            font-weight: 700;
            border-left: 4px solid #198754;
            padding-left: 12px;
            margin-bottom: 24px;
            font-size: 20px;
        }

        /* ── Ebook-style Success Story Card ─────────────────────── */
        .ss-ebook-card {
            background: #fff;
            border: 1.5px solid #b7dcae;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            padding: 20px;
            gap: 20px;
            transition: transform .3s, box-shadow .3s;
        }

        .ss-ebook-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .1);
        }

        .ss-thumb-wrap {
            display: block;
            width: 140px;
            height: 190px;
            background: #f4f6f7;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .15);
            text-decoration: none;
        }

        .ss-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .ss-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .ss-info-badge {
            background: #eef8f0;
            color: #198754;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            width: fit-content;
            margin-bottom: 10px;
        }

        .ss-info-title {
            font-size: 19px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 8px;
            color: #1a1a1a;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .ss-info-location {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #198754;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .ss-info-desc {
            color: #6c757d;
            font-size: 14px;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .ss-info-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #1a1a1a;
        }

        .ss-info-meta div {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ss-info-meta i {
            color: #1a1a1a;
            font-size: 16px;
        }

        .ss-tags-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .ss-tag-badge {
            background: #fff;
            color: #1a1a1a;
            border: 1.5px solid #8fc07f;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 500;
        }

        .ss-view-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #198754;
            font-size: 13px;
            font-weight: 600;
            margin-top: auto;
            text-decoration: none;
            transition: gap .2s;
        }

        .ss-view-btn:hover {
            gap: 10px;
        }

        /* ── Skeleton loading cards ──────────────────────────────── */
        .ss-skeleton-card {
            background: #fff;
            border: 1.5px solid #e9ecef;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            gap: 20px;
            overflow: hidden;
        }

        .ss-skeleton-thumb {
            width: 140px;
            height: 190px;
            border-radius: 6px;
            flex-shrink: 0;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 400% 100%;
            animation: ss-shimmer 1.4s infinite;
        }

        .ss-skeleton-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        .ss-skeleton-line {
            height: 14px;
            border-radius: 4px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 400% 100%;
            animation: ss-shimmer 1.4s infinite;
        }

        @keyframes ss-shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* Mobile — stack thumbnail on top */
        @media (max-width: 767.98px) {
            .ss-ebook-card {
                flex-direction: column;
            }
            .ss-thumb-wrap {
                width: 140px;
                height: 190px;
                margin: 0 auto 16px;
            }
            .ss-skeleton-card {
                flex-direction: column;
            }
            .ss-skeleton-thumb {
                width: 140px;
                height: 190px;
                margin: 0 auto;
            }
        }

        /* ── No results ─────────────────────────────────────────── */
        #ss-no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        #ss-no-results i {
            font-size: 48px;
            color: #dee2e6;
            display: block;
            margin-bottom: 12px;
        }
    </style>
</head>
